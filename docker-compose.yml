services:
  studio:
    build: .
    container_name: sleep-studio
    restart: unless-stopped
    env_file: .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./audio:/app/audio
      - ./images:/app/images
      - ./videos:/app/videos
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
