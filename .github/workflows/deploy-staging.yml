name: Deploy Sleep Studio Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: sleep-studio-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, sleep-studio]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q src *.py

  deploy:
    needs: validate
    runs-on: [self-hosted, Linux, X64, sleep-studio]
    timeout-minutes: 30
    environment: staging
    env:
      STUDIO_ENV_FILE: ${{ secrets.STUDIO_ENV_FILE }}
      STUDIO_DEPLOY_DIR: /home/administrator/sleep-doc-pipeline-staging
      STUDIO_BIND_PORT: "8091"
      COMPOSE_PROJECT_NAME: sleep-doc-pipeline-staging
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Validate staging environment secret
        shell: bash
        run: |
          if [[ -z "${STUDIO_ENV_FILE:-}" ]]; then
            echo "Add STUDIO_ENV_FILE to the staging GitHub environment secrets." >&2
            exit 1
          fi
          required_keys=(
            GEMINI_API_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
            ADMIN_SESSION_SECRET PUBLIC_BASE_URL POSTGRES_PASSWORD DATABASE_URL
            ADMIN_EMAIL AUTH_IP_HASH_SALT OAUTH_TOKEN_ENCRYPTION_KEY
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PREFIX
            STUDIO_CONTAINER_PREFIX STUDIO_BIND_PORT
            GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET
          )
          for key in "${required_keys[@]}"; do
            if ! grep -Eq "^${key}=.+$" <<< "${STUDIO_ENV_FILE}"; then
              echo "Staging STUDIO_ENV_FILE is missing a non-empty ${key} entry." >&2
              exit 1
            fi
          done
          if grep -Eq '^\+[^=]+=' <<< "${STUDIO_ENV_FILE}"; then
            echo "STUDIO_ENV_FILE contains a key beginning with '+'." >&2
            exit 1
          fi
          if ! grep -Fxq 'PUBLIC_BASE_URL=https://staging.myautomationstudio.com' <<< "${STUDIO_ENV_FILE}"; then
            echo "Staging PUBLIC_BASE_URL must be https://staging.myautomationstudio.com." >&2
            exit 1
          fi
          if ! grep -Fxq 'R2_PREFIX=sleep-studio-staging' <<< "${STUDIO_ENV_FILE}"; then
            echo "Staging R2_PREFIX must be sleep-studio-staging." >&2
            exit 1
          fi
          if ! grep -Fxq 'STUDIO_CONTAINER_PREFIX=sleep-studio-staging' <<< "${STUDIO_ENV_FILE}"; then
            echo "Staging STUDIO_CONTAINER_PREFIX must be sleep-studio-staging." >&2
            exit 1
          fi
          if ! grep -Fxq 'STUDIO_BIND_PORT=8091' <<< "${STUDIO_ENV_FILE}"; then
            echo "Staging STUDIO_BIND_PORT must be 8091." >&2
            exit 1
          fi
      - name: Deploy staging
        run: ./deploy.sh
      - name: Show staging service status
        if: success()
        env:
          COMPOSE_PROJECT_NAME: sleep-doc-pipeline-staging
        run: docker compose --project-directory /home/administrator/sleep-doc-pipeline-staging ps
