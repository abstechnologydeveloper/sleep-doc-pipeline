{% extends 'base.html' %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">Operations</p><h1>Jobs</h1><p>Track generation, uploaded media, publishing, failures, and completed work.</p></div>
</div>
<section class="panel">
  <form class="filter-bar" method="get" action="/jobs">
    <label>Workflow<select name="workflow"><option value="all" {{ 'selected' if workflow == 'all' else '' }}>All workflows</option><option value="storytelling" {{ 'selected' if workflow == 'storytelling' else '' }}>Storytelling</option><option value="social" {{ 'selected' if workflow == 'social' else '' }}>Social and uploads</option></select></label>
    <label>Status<select name="status"><option value="all">All statuses</option>{% for status in job_statuses %}<option value="{{ status }}" {{ 'selected' if selected_status == status else '' }}>{{ status|replace('_', ' ')|title }}</option>{% endfor %}</select></label>
    <button class="button secondary" type="submit">Apply filters</button>
  </form>
  {% include '_job_table.html' %}
</section>
{% endblock %}
