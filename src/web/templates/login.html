{% extends 'base.html' %}
{% block content %}
<section class="login-panel">
  <div class="login-brand"><span class="brand-mark">S</span><div><strong>Sleep Studio</strong><small>Content production workspace</small></div></div>
  <div><p class="eyebrow">Administrator access</p><h1>Welcome back</h1><p>Sign in to manage video creation and publishing.</p></div>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" class="studio-form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
