services:
  postgres:
    image: postgres:17-alpine
    container_name: ${STUDIO_CONTAINER_PREFIX:-sleep-studio}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sleep_studio}
      POSTGRES_USER: ${POSTGRES_USER:-sleep_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  studio:
    build: .
    container_name: ${STUDIO_CONTAINER_PREFIX:-sleep-studio}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STUDIO_BIND_PORT:-8090}:8090"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./audio:/app/audio
      - ./images:/app/images
      - ./videos:/app/videos
      - ./thumbnails:/app/thumbnails
      - ./sounds:/app/sounds
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
