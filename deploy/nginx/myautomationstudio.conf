server {
    listen 80;
    listen [::]:80;
    server_name myautomationstudio.com www.myautomationstudio.com staging.myautomationstudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myautomationstudio.com;

    ssl_certificate /etc/letsencrypt/live/myautomationstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myautomationstudio.com/privkey.pem;

    return 301 https://myautomationstudio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myautomationstudio.com;

    ssl_certificate /etc/letsencrypt/live/myautomationstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myautomationstudio.com/privkey.pem;

    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.myautomationstudio.com;

    ssl_certificate /etc/letsencrypt/live/myautomationstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myautomationstudio.com/privkey.pem;

    client_max_body_size 2048m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
