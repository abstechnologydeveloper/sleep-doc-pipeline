{% macro nav_icon(name) -%}
<span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{% if name == 'home' %}<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/>
{% elif name == 'create' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
{% elif name == 'gallery' %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 17 4-4 3 3 2-2 5 3"/>
{% elif name == 'publish' %}<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 14v6h14v-6"/>
{% elif name == 'bell' %}<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8"/><path d="M10 21h4"/>
{% elif name == 'account' %}<circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>
{% elif name == 'video' %}<rect x="3" y="6" width="14" height="12" rx="2"/><path d="m17 10 4-2v8l-4-2"/>
{% elif name == 'customers' %}<circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20a6 6 0 0 1 12 0M14 16a5 5 0 0 1 7 4"/>
{% elif name == 'payments' or name == 'subscription' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>
{% elif name == 'usage' %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{% elif name == 'audit' %}<path d="M9 5h11M9 12h11M9 19h11"/><circle cx="4" cy="5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="19" r="1"/>
{% endif %}</svg></span>
{%- endmacro %}
