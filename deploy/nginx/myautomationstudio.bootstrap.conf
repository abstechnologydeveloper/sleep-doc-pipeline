server {
    listen 80;
    listen [::]:80;
    server_name myautomationstudio.com www.myautomationstudio.com staging.myautomationstudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "My Automation Studio HTTPS setup is in progress.\n";
        add_header Content-Type text/plain;
    }
}
